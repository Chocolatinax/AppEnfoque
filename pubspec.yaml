name: enfoque_app
description: "Floria: app de enfoque para estudiantes (Grupo 6, ESEN 2026)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.4.5
  path: ^1.9.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_analytics: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.4.4
  flutter_launcher_icons: ^0.14.4
  fake_cloud_firestore: ^4.5.0

flutter:

  uses-material-design: true

  # Solo las imágenes que usa la app (el resto de assets/branding/ son archivos de marca)
  assets:
    - assets/branding/floria_isotipo_verde.png
    - assets/branding/floria_isotipo_claro.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/floria_app_icon.png"
  adaptive_icon_background: "#2F6B4F"
  adaptive_icon_foreground: "assets/branding/floria_icon_foreground.png"
  remove_alpha_ios: true
